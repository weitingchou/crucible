{{/*
Two worker deployments from one template: "dispatch" runs dispatcher_task,
"execute" runs k6_executor_task.  They must not share a pool — a dispatcher
holds its slot until its executor finishes, so on a shared pool dispatchers
can occupy every slot and starve the executors they are waiting for.
*/}}

{{/* The old single-worker keys silently become no-ops after the split, so
     fail loudly instead of quietly applying chart defaults.  hasKey, not a
     truthiness test: `replicaCount: 0`, `resources: {}` and `tolerations: []`
     are all falsy, and are exactly what an upgrading values file still holds. */}}
{{- range $key := list "replicaCount" "resources" "nodeSelector" "tolerations" "affinity" }}
{{- if hasKey $.Values.worker $key }}
{{- fail (printf "worker.%s moved to worker.dispatch.%s and worker.execute.%s — the worker is now split into two deployments" $key $key $key) }}
{{- end }}
{{- end }}

{{- $root := . }}
{{- range $role := list "dispatch" "execute" }}
{{- $cfg := index $root.Values.worker $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crucible.fullname" $root }}-worker-{{ $role }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "crucible.labels" $root | nindent 4 }}
    {{- include "crucible.selectorLabels" (dict "root" $root "component" (printf "worker-%s" $role)) | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      {{- include "crucible.selectorLabels" (dict "root" $root "component" (printf "worker-%s" $role)) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crucible.labels" $root | nindent 8 }}
        {{- include "crucible.selectorLabels" (dict "root" $root "component" (printf "worker-%s" $role)) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "crucible.serviceAccountName" $root }}
      containers:
        - name: worker-{{ $role }}
          image: {{ include "crucible.image" (dict "registry" (include "crucible.imageRegistry" $root) "image" $root.Values.worker.image) }}
          imagePullPolicy: {{ $root.Values.worker.image.pullPolicy }}
          # Consume one queue, with an explicit pool size.  Without -c, Celery
          # sizes the pool from os.cpu_count(), which on Kubernetes reports the
          # node's CPUs rather than the pod's limit.
          command:
            - celery
            - -A
            - worker.celery_app
            - worker
            - -Q
            - {{ $role | quote }}
            - -c
            - {{ $cfg.concurrency | quote }}
            - -n
            - {{ printf "%s@%%h" $role | quote }}
            - --loglevel=info
          env:
            {{- include "crucible.workerEnv" $root | nindent 12 }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $cfg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
